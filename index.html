<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAND RolePlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#ef4444',
                            dark: '#09090b',
                            card: '#18181b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-brand-dark text-white font-sans antialiased overflow-x-hidden selection:bg-brand-red selection:text-white flex flex-col min-h-screen">
    
    <!-- Background Effects -->
    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-brand-dark to-brand-dark"></div>
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-red-900/20 blur-[120px] rounded-full z-[-1] pointer-events-none"></div>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 glass-nav border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.router.navigate('home')">
                <div class="w-8 h-8 rounded bg-brand-red flex items-center justify-center neon-shadow">
                    <i data-lucide="crosshair" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-display text-xl font-bold tracking-wider uppercase">GRAND<span class="text-brand-red">RP</span></span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-medium text-zinc-400">
                <a href="#" onclick="window.router.navigate('home')" class="hover:text-white transition-colors">Home</a>
                <a href="#" onclick="window.router.navigate('rules')" class="hover:text-white transition-colors">Rules</a>
                <a href="#" onclick="window.router.navigate('apply')" class="hover:text-white transition-colors">Apply</a>
                <a href="#" onclick="window.router.navigate('admin')" class="hover:text-white transition-colors" id="nav-admin" style="display:none;">Dashboard</a>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="window.router.navigate('login')" id="nav-login-btn" class="hidden md:block text-sm font-medium text-zinc-300 hover:text-white transition-colors">Login</button>
                <button onclick="window.router.navigate('apply')" class="btn-primary text-sm px-6 py-2.5 rounded bg-brand-red text-white font-semibold flex items-center gap-2 transition-all hover:bg-red-500">
                    <span>Whitelist</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-root" class="flex-grow pt-20 flex flex-col"></main>

    <!-- Footer -->
    <footer class="border-t border-white/5 bg-brand-dark/80 backdrop-blur-md mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex flex-col items-center md:items-start gap-2">
                <span class="font-display text-lg font-bold tracking-wider uppercase">GRAND <span class="text-brand-red">RP</span></span>
                <p class="text-xs text-zinc-500">© 2026 GRAND RolePlay. All rights reserved.</p>
            </div>
            <div class="flex gap-4 text-zinc-500">
                <a href="#" class="hover:text-brand-red transition-colors"><i data-lucide="twitter" class="w-5 h-5"></i></a>
                <a href="#" class="hover:text-brand-red transition-colors"><i data-lucide="youtube" class="w-5 h-5"></i></a>
                <a href="#" class="hover:text-brand-red transition-colors"><i data-lucide="message-square" class="w-5 h-5"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="./app.js"></script>
</body>
</html>
